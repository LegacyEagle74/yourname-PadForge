name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used by the Release step on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/PadForge-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/PadForge.apk
          cp -r pc-companion dist/pc-companion

      - uses: actions/upload-artifact@v4
        with:
          name: PadForge
          path: dist/

      # Pushing a tag like v1.0 also publishes a GitHub Release with the APK attached.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PadForge.apk
