name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used by the Release step on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/PadForge-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/PadForge.apk
          cp -r pc-companion dist/pc-companion

      - uses: actions/upload-artifact@v4
        with:
          name: PadForge
          path: dist/

      # Every push to main refreshes the "latest" release, so the newest APK
      # always has a stable download link on the repo's Releases page.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr PadForge-pc-companion.zip pc-companion)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            dist/PadForge.apk dist/PadForge-pc-companion.zip \
            --target "${{ github.sha }}" \
            --title "PadForge (latest build)" \
            --notes "Install **PadForge.apk** on your Android phone. Unzip **PadForge-pc-companion.zip** on your Windows PC and run start_padforge.bat. Built from ${{ github.sha }}."

      # Pushing a tag like v1.0 also publishes a versioned GitHub Release.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PadForge.apk
